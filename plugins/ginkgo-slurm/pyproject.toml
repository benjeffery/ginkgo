[project]
name = "ginkgo-slurm"
version = "0.5.0"
description = "Slurm executor for ginkgo: run tasks as batch jobs on a shared filesystem"
requires-python = ">= 3.12"
readme = { text = "# ginkgo-slurm\n\nSlurm executor for ginkgo: run tasks as `sbatch` jobs on a cluster whose nodes share the project's filesystem.\n\nA plugin for [Ginkgo](https://sanjaynagi.github.io/ginkgo/).", content-type = "text/markdown" }
license = "Apache-2.0"
dependencies = ["ginkgo-workflow==0.5.0"]

[project.entry-points."ginkgo.plugins"]
slurm = "ginkgo_slurm:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_slurm"]
